<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0768bb">
  <meta name="color-scheme" content="light dark">
  <title>Seite nicht gefunden · Kitsos API Docs</title>
  <link rel="icon" type="image/png" href="https://cdn.kitsos.net/logos/fav/favicon-96x96.png">
  <link rel="stylesheet" href="/consent.css">
  <style>
    @font-face { font-family:"Kitsos Default"; src:url("https://cdn.kitsos.net/fonts/kitsos-default/kitsos-default-regular.woff2") format("woff2"),url("https://cdn2.kitsos.net/fonts/kitsos-default/kitsos-default-regular.woff2") format("woff2"),url("https://cdn3.kitsos.net/fonts/kitsos-default/kitsos-default-regular.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
    :root { color-scheme:light dark; --primary:#0768bb; --primary-hover:#055a9f; --primary-soft:#e7f2fc; --bg:#f7f9fc; --surface:#fff; --text:#111827; --muted:#52606d; --border:#dce5ee; --font:"Kitsos Default",Arial,Helvetica,sans-serif; }
    @media (prefers-color-scheme:dark) { :root { --primary:#03a9f4; --primary-hover:#38bdf8; --primary-soft:#06314b; --bg:#09131d; --surface:#101e2a; --text:#f3f7fb; --muted:#a8b8c8; --border:#284052; } }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 var(--font); }
    main { width:min(560px,calc(100% - 48px)); padding:48px; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:0 8px 24px rgb(15 35 55 / 10%); text-align:center; }
    picture { display:block; width:56px; height:56px; margin:0 auto 28px; }
    picture img { display:block; width:100%; height:100%; object-fit:contain; }
    p { color:var(--muted); }
    .code { margin:0; color:var(--primary); font-size:14px; font-weight:600; letter-spacing:.08em; }
    h1 { margin:8px 0 16px; font-size:36px; line-height:1.22; }
    .button { display:inline-flex; min-height:44px; align-items:center; justify-content:center; margin-top:16px; padding:0 16px; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; text-decoration:none; }
    .button:hover { background:var(--primary-hover); }
    .button:focus-visible { outline:3px solid var(--primary-soft); outline-offset:3px; }
    @media (prefers-color-scheme:dark) { main { box-shadow:none; } .button { color:#09131d; } }
    @media (max-width:520px) { main { width:min(100% - 32px,560px); padding:36px 24px; } h1 { font-size:30px; } }
  </style>
</head>
<body>
  <main>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="https://cdn.kitsos.net/logos/k-dark.png">
      <img src="https://cdn.kitsos.net/logos/k.png" alt="Kitsos">
    </picture>
    <p class="code">FEHLER 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die angeforderte API-Dokumentation wurde nicht gefunden. Auf der Startseite findest du alle verfügbaren Dokumentationen.</p>
    <a class="button" href="/">Zu den API Docs</a>
  </main>
  <div class="consent" id="consent"><div class="consent-inner"><div class="consent-text">Wir verwenden Cookies für Analysen zur Verbesserung unserer Dienste. <a href="https://kitsos.net/privacy">Mehr erfahren</a>.</div><div class="consent-btns"><button class="consent-accept" type="button">Akzeptieren</button><button class="consent-decline" type="button">Ablehnen</button></div></div></div>
  <script>
    (() => { const cdns = ["https://cdn.kitsos.net", "https://cdn2.kitsos.net", "https://cdn3.kitsos.net"]; document.querySelectorAll("img[src^='https://cdn']").forEach((image) => { const path = new URL(image.currentSrc || image.src).pathname; let index = 1; image.addEventListener("error", () => { if (index < cdns.length) { image.closest("picture")?.querySelectorAll("source").forEach((source) => source.remove()); image.src = cdns[index++] + path; } }); }); })();
  </script>
  <script src="/consent.js"></script>
  <script src="/utm-links.js"></script>
</body>
</html>
