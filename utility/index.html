<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitsos Utility API - OpenAPI Documentation</title>

    <!-- Swagger CSS -->
    <link id="swagger-css" rel="stylesheet"
          href="https://cdn.kitsos.net/api/swagger/5.29.1/swagger-ui.min.css">

    <!-- Favicons -->
    <link rel="icon" type="image/png"
          href="https://cdn.kitsos.net/logos/fav/favicon-96x96.png">

    <style>
        body {
            margin: 0;
            background: #f8fafc;
        }

        .topbar {
            display: none;
        }

        .swagger-ui .opblock {
            border-radius: 10px;
        }

        .swagger-ui .opblock-summary {
            padding: 10px;
        }
    </style>

</head>

<body>

<div id="openapi"></div>


<script>

const CDNS = [
    "https://cdn.kitsos.net",
    "https://cdn2.kitsos.net",
    "https://cdn3.kitsos.net"
];


function randomBackup(exclude = []) {

    const available = CDNS.filter(
        cdn => !exclude.includes(cdn)
    );

    return available[
        Math.floor(Math.random() * available.length)
    ];

}




// Schnellstes CDN für Datei ermitteln
function getFastest(urlPath) {

    return new Promise((resolve, reject) => {


        let finished = false;
        let started = [];


        function request(cdn) {

            started.push(cdn);


            fetch(cdn + urlPath, {
                method: "GET",
                cache: "no-cache"
            })

            .then(response => {

                if (!response.ok)
                    throw new Error();


                if (!finished) {

                    finished = true;

                    resolve(cdn + urlPath);

                }

            })

            .catch(() => {});

        }



        // Haupt-CDN sofort
        request(CDNS[0]);



        // Nach 500ms Backup starten
        setTimeout(() => {


            if (finished)
                return;


            request(
                randomBackup(started)
            );


        }, 500);



        // Falls noch nichts antwortet -> letzter CDN
        setTimeout(() => {


            if (finished)
                return;


            CDNS
            .filter(cdn => !started.includes(cdn))
            .forEach(request);


        }, 1500);



        setTimeout(() => {


            if (!finished)
                reject("Kein CDN erreichbar");


        }, 8000);


    });

}





// CDN Loader für CSS/JS
function loadCDNFile(path, type) {


    return getFastest(path)

    .then(url => {


        return new Promise(resolve => {


            if (type === "css") {


                document.getElementById("swagger-css").href = url;

                resolve();

            }


            if (type === "js") {


                const script =
                    document.createElement("script");


                script.src = url;


                script.onload = resolve;


                document.head.appendChild(script);

            }


        });


    });


}




async function loadSwagger() {


    await loadCDNFile(
        "/api/swagger/5.29.1/swagger-ui-bundle.min.js",
        "js"
    );


    await loadCDNFile(
        "/api/swagger/5.29.1/swagger-ui-standalone-preset.min.js",
        "js"
    );


    initSwagger();

}





function initSwagger() {


    if (
        typeof SwaggerUIBundle === "undefined" ||
        typeof SwaggerUIStandalonePreset === "undefined"
    ) {

        return setTimeout(initSwagger,50);

    }



    getFastest(
        "/api/utility/openapi.yaml"
    )

    .then(openapiUrl => {



        window.ui = SwaggerUIBundle({


            url: openapiUrl,


            dom_id:"#openapi",


            deepLinking:true,


            displayRequestDuration:true,


            docExpansion:"list",


            defaultModelsExpandDepth:-1,


            defaultModelExpandDepth:2,


            validatorUrl:null,


            presets:[

                SwaggerUIBundle.presets.apis,

                SwaggerUIStandalonePreset

            ],


            layout:"StandaloneLayout"


        });



    })


    .catch(() => {


        document.getElementById("openapi").innerHTML =
        "OpenAPI konnte nicht geladen werden.";


    });


}




window.onload = loadSwagger;


</script>


</body>
</html>
